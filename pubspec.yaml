name: milyoner_live
description: Interactive Millionaire game for TikTok Live
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true
  assets:
    - assets/locales/
    - assets/questions/
    - assets/logo/applogo.png
    - assets/logo/logo.svg